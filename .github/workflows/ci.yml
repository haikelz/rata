name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run lint

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build application
        run: bun run build

      - name: Check prerendered URLs use the production origin
        run: '! grep -rq sveltekit-prerender .svelte-kit/output/prerendered'
